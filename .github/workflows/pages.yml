name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # Publish ONLY public site files. CRM data, missions, and the event log
      # must never ship to Pages (they will contain lead PII and pipeline state).
      - name: Assemble public site artifact
        run: |
          mkdir -p _site/MBM/Dashboard
          cp index.html platform.html _site/
          cp MBM/Dashboard/index.html MBM/Dashboard/metrics.json _site/MBM/Dashboard/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
