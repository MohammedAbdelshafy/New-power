<head><title>Off-Market Seller Feed</title></head>

    data-parcel="APN-11-223-004"

  <!-- Net-new lead not present in the county source -->
  <article class="listing"
    data-parcel="APN-66-540-118"

    data-phone="727-555-0311"

    data-signals="tax_delinquent">

  <article class="listing"
    data-parcel="APN-66-540-118"
